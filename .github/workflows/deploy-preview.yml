name: Deploy preview environment

on:
  pull_request:
    branches:
      - v2
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-affected:
    runs-on: ubuntu-latest
    outputs:
      affected_packages: ${{ steps.detect.outputs.affected_packages }}
      lint_packages: ${{ steps.detect.outputs.lint_packages }}
      test_packages: ${{ steps.detect.outputs.test_packages }}
      typecheck_targets: ${{ steps.detect.outputs.typecheck_targets }}
      should_build_site: ${{ steps.detect.outputs.should_build_site }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20.x"
          cache: pnpm
      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Collect affected packages
        id: detect
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF" --depth=1
          git diff --name-only "origin/$BASE_REF...HEAD" > changed-files.txt
          pnpm changeset status --since="origin/$BASE_REF" --output=changeset-status.json || true
          pnpm --filter "...[origin/$BASE_REF]" list --depth -1 --json > pnpm-affected.json || echo "[]" > pnpm-affected.json
          node - <<'NODE'
          const fs = require("fs")
          const path = require("path")

          const packagesRoot = path.join(process.cwd(), "packages")
          const changedFiles = fs.existsSync("changed-files.txt")
            ? fs.readFileSync("changed-files.txt", "utf8").split(/\r?\n/).filter(Boolean)
            : []

          const workspacePackages = new Map()
          for (const entry of fs.readdirSync(packagesRoot, { withFileTypes: true })) {
            if (!entry.isDirectory()) continue
            const packageJsonPath = path.join(packagesRoot, entry.name, "package.json")
            if (!fs.existsSync(packageJsonPath)) continue
            const manifest = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"))
            workspacePackages.set(manifest.name, {
              name: manifest.name,
              dir: path.join("packages", entry.name),
              scripts: manifest.scripts || {},
              hasTsconfig: fs.existsSync(path.join(packagesRoot, entry.name, "tsconfig.json")),
              hasTsconfigLib: fs.existsSync(path.join(packagesRoot, entry.name, "tsconfig.lib.json")),
            })
          }

          const changesetStatus = fs.existsSync("changeset-status.json")
            ? JSON.parse(fs.readFileSync("changeset-status.json", "utf8"))
            : {}
          const pnpmAffected = fs.existsSync("pnpm-affected.json")
            ? JSON.parse(fs.readFileSync("pnpm-affected.json", "utf8"))
            : []

          const affectedNames = new Set([
            ...(changesetStatus.releases || []).map(release => release.name),
            ...pnpmAffected.map(entry => entry.name),
          ].filter(Boolean))

          const affectedPackages = [...affectedNames]
            .map(name => workspacePackages.get(name))
            .filter(Boolean)
            .sort((a, b) => a.name.localeCompare(b.name))

          const lintPackages = affectedPackages
            .filter(pkg => Boolean(pkg.scripts.lint))
            .map(pkg => pkg.name)

          const testPackages = affectedPackages
            .filter(pkg => Boolean(pkg.scripts.test))
            .map(pkg => pkg.name)

          const typecheckTargets = affectedPackages
            .map(pkg => {
              const script = ["type-check", "typecheck", "tsc", "compile"].find(name => Boolean(pkg.scripts[name]))
              if (script) {
                return { name: pkg.name, mode: "script", script }
              }
              if (pkg.hasTsconfig) {
                return { name: pkg.name, mode: "exec", project: "tsconfig.json" }
              }
              if (pkg.hasTsconfigLib) {
                return { name: pkg.name, mode: "exec", project: "tsconfig.lib.json" }
              }
              return null
            })
            .filter(Boolean)

          const websitePackage = workspacePackages.get("typescriptlang-org")
          const websiteWorkspaceDeps = websitePackage
            ? Object.keys(JSON.parse(fs.readFileSync(path.join(websitePackage.dir, "package.json"), "utf8")).dependencies || {})
                .filter(name => workspacePackages.has(name))
            : []
          const siteContentPackages = ["documentation", "glossary", "tsconfig-reference", "community-meta"]
          const siteTriggerFiles = new Set([
            "package.json",
            "pnpm-workspace.yaml",
            "pnpm-lock.yaml",
            ".changeset/config.json",
            ".github/workflows/deploy-preview.yml",
          ])
          const siteTriggerDirs = [
            "packages/typescriptlang-org/",
            "packages/documentation/",
            "packages/glossary/",
            "packages/tsconfig-reference/",
            "packages/community-meta/",
          ]

          const shouldBuildSite =
            affectedPackages.some(pkg => ["typescriptlang-org", ...websiteWorkspaceDeps, ...siteContentPackages].includes(pkg.name)) ||
            changedFiles.some(file => siteTriggerFiles.has(file) || siteTriggerDirs.some(dir => file.startsWith(dir)))

          const appendOutput = (key, value) => {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${JSON.stringify(value)}\n`)
          }

          appendOutput("affected_packages", affectedPackages.map(pkg => pkg.name))
          appendOutput("lint_packages", lintPackages)
          appendOutput("test_packages", testPackages)
          appendOutput("typecheck_targets", typecheckTargets)
          appendOutput("should_build_site", shouldBuildSite)
          NODE

  lint:
    runs-on: ubuntu-latest
    needs: detect-affected
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20.x"
          cache: pnpm
      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bootstrap workspace
        run: |
          pnpm docs-sync pull microsoft/TypeScript-Website-localizations#main 1
          pnpm bootstrap
      - name: Run lint
        env:
          LINT_PACKAGES: ${{ needs.detect-affected.outputs.lint_packages }}
        run: |
          node - <<'NODE'
          const { spawnSync } = require("child_process")

          const packages = JSON.parse(process.env.LINT_PACKAGES)
          if (!packages.length) {
            console.log("No affected packages expose a lint script")
            process.exit(0)
          }

          for (const pkg of packages) {
            console.log(`\n> pnpm --filter ${pkg} run lint`)
            const result = spawnSync("pnpm", ["--filter", pkg, "run", "lint"], { stdio: "inherit" })
            if (result.status !== 0) {
              process.exit(result.status || 1)
            }
          }
          NODE

  type-check:
    runs-on: ubuntu-latest
    needs: detect-affected
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20.x"
          cache: pnpm
      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bootstrap workspace
        run: |
          pnpm docs-sync pull microsoft/TypeScript-Website-localizations#main 1
          pnpm bootstrap
      - name: Run type-check
        env:
          TYPECHECK_TARGETS: ${{ needs.detect-affected.outputs.typecheck_targets }}
        run: |
          node - <<'NODE'
          const { spawnSync } = require("child_process")

          const targets = JSON.parse(process.env.TYPECHECK_TARGETS)
          if (!targets.length) {
            console.log("No affected packages expose a type-check entrypoint")
            process.exit(0)
          }

          for (const target of targets) {
            const args = target.mode === "script"
              ? ["--filter", target.name, "run", target.script]
              : ["--filter", target.name, "exec", "tsc", "--noEmit", "-p", target.project]

            console.log(`\n> pnpm ${args.join(" ")}`)
            const result = spawnSync("pnpm", args, { stdio: "inherit" })
            if (result.status !== 0) {
              process.exit(result.status || 1)
            }
          }
          NODE

  test:
    runs-on: ubuntu-latest
    needs: detect-affected
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20.x"
          cache: pnpm
      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bootstrap workspace
        run: |
          pnpm docs-sync pull microsoft/TypeScript-Website-localizations#main 1
          pnpm bootstrap
      - name: Run test
        env:
          TEST_PACKAGES: ${{ needs.detect-affected.outputs.test_packages }}
        run: |
          node - <<'NODE'
          const { spawnSync } = require("child_process")

          const packages = JSON.parse(process.env.TEST_PACKAGES)
          if (!packages.length) {
            console.log("No affected packages expose a test script")
            process.exit(0)
          }

          for (const pkg of packages) {
            console.log(`\n> pnpm --filter ${pkg} run test`)
            const result = spawnSync("pnpm", ["--filter", pkg, "run", "test"], {
              stdio: "inherit",
              env: { ...process.env, CI: "true" },
            })
            if (result.status !== 0) {
              process.exit(result.status || 1)
            }
          }
          NODE

  build-site:
    runs-on: ubuntu-latest
    needs:
      - detect-affected
      - lint
      - type-check
      - test
    if: ${{ fromJson(needs.detect-affected.outputs.should_build_site) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20.x"
          cache: pnpm
      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build website
        run: |
          pnpm docs-sync pull microsoft/TypeScript-Website-localizations#main 1
          pnpm bootstrap
          pnpm run --filter=typescriptlang-org setup-playground-cache-bust
          pnpm run --filter=typescriptlang-org build
      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: site
          path: packages/typescriptlang-org/public

  deploy:
    runs-on: ubuntu-latest
    needs:
      - detect-affected
      - build-site
    if: ${{ fromJson(needs.detect-affected.outputs.should_build_site) && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: site
          path: site
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Upload preview to Azure Storage
        uses: azure/CLI@v2
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          PREVIEW_PREFIX: pr-${{ github.event.pull_request.number }}
        with:
          inlineScript: |
            set -euo pipefail
            az storage blob delete-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --source '$web' \
              --pattern "$PREVIEW_PREFIX/*" \
              --auth-mode login || true
            az storage blob upload-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --destination '$web/'"$PREVIEW_PREFIX" \
              --source site \
              --overwrite \
              --auth-mode login
      - name: Set preview URL
        id: preview-url
        run: echo "preview_url=https://pr-${{ github.event.pull_request.number }}.typescriptlang.org/" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.preview_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = "<!-- pr-preview-link -->"
            const body = `${marker}\nPreview environment is ready: ${process.env.PREVIEW_URL}`
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            })

            const existing = comments.find(comment =>
              comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              })
            }
