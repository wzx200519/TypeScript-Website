name: Close preview environment

on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: string
        description: PR number
  pull_request_target:
    types:
      - closed

permissions:
  contents: read
  id-token: write

jobs:
  close:
    runs-on: ubuntu-latest
    if: github.repository == 'microsoft/TypeScript-Website'
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Remove preview from Azure Storage
        uses: azure/CLI@v2
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          PR_NUMBER: ${{ github.event.inputs.pr || github.event.pull_request.number }}
        with:
          inlineScript: |
            set -euo pipefail
            az storage blob delete-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --source '$web' \
              --pattern "pr-$PR_NUMBER/*" \
              --auth-mode login || true
